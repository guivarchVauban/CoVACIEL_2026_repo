slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    use_scan_matching: true
    use_scan_barycenter: true

    # --- HAUTE DÉFINITION RÉPARTIE (Géré par le PC) ---
    max_laser_range: 3.5
    resolution: 0.05
    map_update_interval: 3.0
    minimum_travel_distance: 0.20
    minimum_travel_heading: 0.10
    transform_timeout: 1.5           # <--- Patience Wi-Fi
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

    # --- DÉTECTION DE BOUCLE AGRESSIVE (Pour forcer le collage) ---
    enable_interactive_mode: false
    do_loop_closing: true
    loop_search_maximum_distance: 2.5              # <--- On cherche le début plus loin !
    loop_match_minimum_chain_size: 5
    loop_match_maximum_variance_covariance: 2     # <--- On est beaucoup moins frileux !
    loop_match_minimum_response_coarse: 0.40       # <--- On accepte un collage moyen...
    loop_match_minimum_response_fine: 0.45          # <--- ...pourvu que ça colle !
